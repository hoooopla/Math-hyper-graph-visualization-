name: Check Proof Atlas
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  website:
    name: Website tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check

  graph-validation:
    name: Canonical graph validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python core/validation/validate_graphs.py
      - run: python core/validation/validate_policies.py
      - run: python -m unittest discover -s tests -p 'test_validate_policies.py'

  instructor-workspace:
    name: Generated instructor workspace validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: node scripts/create-instructor-workspace.mjs "$RUNNER_TEMP/instructor-workspace"
      - run: python "$RUNNER_TEMP/instructor-workspace/scripts/validate_graphs.py"
      - run: python "$RUNNER_TEMP/instructor-workspace/scripts/validate_policies.py"
